<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cybersecurity Awareness Center</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">🛡️ CYBER-DEFENSE SOC DASHBOARD</div>
        <nav>
            <a href="index.html">SOC Analytics</a>
            <a href="awareness.html" class="active">Awareness Center</a>
            <a href="quiz.html">Security Quiz</a>
        </nav>
    </header>
    <main class="container">
        <h2>Defensive Security Awareness Modules</h2>
        <div id="moduleGrid" class="kpi-grid"></div>
    </main>
    <script>
        fetch('/api/awareness/modules')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('moduleGrid');
                grid.innerHTML = data.map(m => `
                    <div class="kpi-card" style="grid-column: span 1;">
                        <h3 style="color:#38bdf8; font-size:1.1rem;">${m.title}</h3>
                        <p style="font-size:0.95rem; color:#94a3b8; font-weight:normal;">${m.summary}</p>
                        <h4 style="margin-top:10px; font-size:0.85rem;">Defensive Controls:</h4>
                        <ul style="font-size:0.85rem; padding-left:18px; color:#cbd5e1;">
                            ${m.best_practices.map(bp => `<li>${bp}</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
            });
    </script>
</body>
</html>
